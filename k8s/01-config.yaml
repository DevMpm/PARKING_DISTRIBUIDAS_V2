# Variables de entorno COMUNES a todos los microservicios.
# Las variables que cambian por servicio (RABBITMQ_QUEUE/EXCHANGE/ROUTING_KEY,
# datos de BD, puertos) se definen dentro de cada Deployment en 05-microservices.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: parking-config
  namespace: parking-ns
data:
  # Conexión a RabbitMQ (el host es el nombre del Service "rabbitmq")
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  # Autorización / Gateway / clave pública JWT
  AUTHZ_EXCHANGE: "authz_exchange"
  KONG_URL: "http://kong:8000"
  PUBLIC_KEY_URL: "http://gestion-usuarios:3001/api/auth/public-key"
---
# Valores sensibles. REEMPLAZA los placeholders con los valores reales de tu archivo .env
apiVersion: v1
kind: Secret
metadata:
  name: parking-secret
  namespace: parking-ns
type: Opaque
stringData:
  INTERNAL_API_KEY: "dev-internal-key-change-me"
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""
