name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-java:
    name: Test ModuloZonas (Java/Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Run Maven Tests
        working-directory: ./ModuloZonas
        run: ./mvnw test

      - name: Run Tests & JaCoCo Report
        working-directory: ./ModuloZonas
        run: mvn clean test jacoco:report # Ajusta si usas Gradle: ./gradlew test jacocoTestReport

      - name: Upload JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jacoco
          path: ./ModuloZonas/target/site/jacoco/ # Ajusta si usas Gradle: build/reports/jacoco/test/html/
          retention-days: 1

  test-node:
    name: Test NestJS Microservices
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gestion-usuarios, assignment-service, VehiclesNPM/vehiculos, ms-auditoria]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './${{ matrix.service }}/package-lock.json'
          
      - name: Install dependencies
        working-directory: ./${{ matrix.service }}
        run: npm ci
        
      - name: Run Tests and Coverage Report
        working-directory: ./${{ matrix.service }}
        timeout-minutes: 10 
        env:
            TESTCONTAINERS_RYUK_DISABLED: 'false'
        run: npm run test:cov

      # Normalizar el nombre del servicio para usarlo como nombre de artefacto/carpeta
      # Remplaza '/' por '-' (ej: VehiclesNPM/vehiculos -> VehiclesNPM-vehiculos)
      - name: Sanitize service name
        id: sanitize
        run: |
          SERVICE_NAME=$(echo "${{ matrix.service }}" | tr '/' '-')
          echo "clean_name=$SERVICE_NAME" >> $GITHUB_OUTPUT

      # Subir el reporte de cobertura HTML de este microservicio
      # NestJS por defecto genera la cobertura en ./coverage/lcov-report
      - name: Upload Jest Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jest-${{ steps.sanitize.outputs.clean_name }}
          path: ./${{ matrix.service }}/coverage/lcov-report/
          retention-days: 1



  test-python:
    name: Test ticket-service (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        working-directory: ./ticket-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pytest with Coverage
        working-directory: ./ticket-service
        run: PYTHONPATH=. pytest --cov=app --cov-report=html:htmlcov app/test/test_tickets.py

      - name: Upload Python Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-ticket-service
          path: ./ticket-service/htmlcov/
          retention-days: 1

  test-integration:
    name: Integration Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: [test-java, test-node, test-python]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install E2E Dependencies
        run: pip install requests

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Start Docker Compose infrastructure
        run: docker compose up -d --build
        
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to initialize..."
          sleep 45
          docker compose ps
          
      - name: Run E2E Python Test Script
        run: python test.py
        
      - name: View Logs on Failure
        if: failure()
        run: docker compose logs

  test-frontend-e2e:
    name: Test Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test-integration]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './parking-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./parking-frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./parking-frontend
        run: npx playwright install --with-deps

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Start Docker Compose infrastructure
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to initialize..."
          sleep 45
          docker compose ps

      - name: Run Playwright E2E Tests
        working-directory: ./parking-frontend
        run: npm run e2e
        env:
          CI: true

      - name: View Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./parking-frontend/test-results/
          retention-days: 7

  


  deploy-test-reports:
      name: Consolidate & Deploy Test Reports
      needs: [test-frontend-e2e] # Espera a que todos los jobs terminen
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest

        # --- AÑADE O REVISA ESTE BLOQUE ---
      permissions:
        contents: read
        pages: write
        id-token: write  # <--- Este es el permiso que te está pidiendo
      # ---------------------------------

      steps:
        - name: Checkout code (Opcional, para scripts)
          uses: actions/checkout@v4

        # Descargar TODOS los artefactos generados en los jobs anteriores
        - name: Download all coverage artifacts
          uses: actions/download-artifact@v4
          with:
            path: artifacts

        # Organizar los reportes en la carpeta 'public' y crear el Index principal
        - name: Organize Reports and Generate Index
          run: |
            mkdir -p public/jest
            mkdir -p public/jacoco
            mkdir -p public/python
            mkdir -p public/e2e

            # Copiar reporte de JaCoCo
            if [ -d "artifacts/coverage-jacoco" ]; then
              cp -r artifacts/coverage-jacoco/* public/jacoco/
            fi

            # Copiar reporte de Python (ticket-service)
            if [ -d "artifacts/coverage-python-ticket-service" ]; then
              cp -r artifacts/coverage-python-ticket-service/* public/python/
            fi

            # Copiar reporte de Playwright E2E
            if [ -d "artifacts/playwright-report" ]; then
              cp -r artifacts/playwright-report/* public/e2e/
            fi

            # Copiar reportes de NestJS (iterar sobre los artefactos descargados)
            for dir in artifacts/coverage-jest-*; do
              if [ -d "$dir" ]; then
                # Extraer el nombre limpio del servicio cortando el prefijo
                SERVICE_NAME=$(basename "$dir" | sed 's/coverage-jest-//')
                mkdir -p "public/jest/$SERVICE_NAME"
                cp -r "$dir"/* "public/jest/$SERVICE_NAME/"
              fi
            done

            # Crear un index.html dinámico
            cat << 'EOF' > public/index.html
            <!DOCTYPE html>
            <html lang="es">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Dashboard de Pruebas</title>
              <style>
                body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #24292f; }
                h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 10px; }
                .section { margin-bottom: 30px; }
                .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
                .card { border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; background: #f6f8fa; }
                .card h3 { margin-top: 0; margin-bottom: 8px; font-size: 16px; }
                a { color: #0969da; text-decoration: none; font-weight: 600; }
                a:hover { text-decoration: underline; }
              </style>
            </head>
            <body>
              <h1>📊 Dashboard de Pruebas</h1>

              <div class="section">
                <h2>Pruebas Unitarias</h2>
                
                <div style="margin-bottom: 20px;">
                  <h3 style="font-size: 18px; color: #57606a;">Java Backend (JaCoCo)</h3>
                  <div class="card">
                    <h3>Servicio Java (ModuloZonas)</h3>
                    <a href="./jacoco/index.html">Ver reporte de cobertura &rarr;</a>
                  </div>
                </div>

                <div style="margin-bottom: 20px;">
                  <h3 style="font-size: 18px; color: #57606a;">Python Microservice (Pytest)</h3>
                  <div class="card">
                    <h3>Ticket Service</h3>
                    <a href="./python/index.html">Ver reporte de cobertura &rarr;</a>
                  </div>
                </div>

                <div>
                  <h3 style="font-size: 18px; color: #57606a;">Microservicios NestJS (Jest)</h3>
                  <div class="grid">
                    <div class="card">
                      <h3>Gestión Usuarios</h3>
                      <a href="./jest/gestion-usuarios/index.html">Ver cobertura &rarr;</a>
                    </div>
                    <div class="card">
                      <h3>Assignment Service</h3>
                      <a href="./jest/assignment-service/index.html">Ver cobertura &rarr;</a>
                    </div>
                    <div class="card">
                      <h3>Vehículos NPM</h3>
                      <a href="./jest/VehiclesNPM-vehiculos/index.html">Ver cobertura &rarr;</a>
                    </div>
                    <div class="card">
                      <h3>Auditoría NPM</h3>
                      <a href="./jest/ms-auditoria/index.html">Ver cobertura &rarr;</a>
                    </div>
                  </div>
                </div>
              </div>

              <div class="section">
                <h2>Pruebas End-to-End (E2E)</h2>
                <div class="card">
                  <h3>Frontend E2E (Playwright)</h3>
                  <a href="./e2e/index.html">Ver reporte E2E &rarr;</a>
                </div>
              </div>
            </body>
            </html>
            EOF

        # Subir y desplegar la carpeta public unificada a GitHub Pages
        - name: Upload Pages Artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: 'public'

        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
