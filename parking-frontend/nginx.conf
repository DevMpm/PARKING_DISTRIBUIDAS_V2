server {
    listen 80;
    server_name _;

    # ── API → Kong (API Gateway) ──
    # Equivale al proxy de Vite: '/api' -> http://localhost:8000
    # Dentro del clúster, Kong es accesible por el nombre de Service "kong".
    location /api/ {
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE (stream de espacios, ticket-service vía Kong) ──
    # Sin buffering para que el stream fluya en tiempo real.
    location /sse/ {
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         3600s;
        chunked_transfer_encoding  off;
    }

    # ── SPA React (fallback a index.html para React Router) ──
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
