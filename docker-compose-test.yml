version: '3.8'

services:

  # ─────────────── BASES DE DATOS ───────────────

  db-test:
    image: postgres:16-alpine
    container_name: db-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    volumes:
      - db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-test-data: